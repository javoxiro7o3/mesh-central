# =============================================================================
#  Reverse proxy (TLS termination) — MeshCentral oldida.
#  Agentlar ham, administrator brauzerlari ham shu 443 portga ulanadi.
#
#  Sertifikat: data/tls/server.crt — setup.sh yaratgan self-signed sertifikat
#  (yoki korxona CA bergan sertifikat). Agentlar uni Windows Trust Store orqali
#  TEKSHIRMAYDI: MeshCentral "certUrl" orqali shu sertifikat hash'ini biladi va
#  agent bilan o'zaro autentifikatsiyada (ServerID = SHA384 pinning) ishlatadi.
# =============================================================================
worker_processes auto;
events { worker_connections 8192; }

http {
    server_tokens off;
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # Katta fayllarni yuklash (Files bo'limi) va uzoq WebSocket sessiyalar
    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_send_timeout 330s;
    proxy_read_timeout 330s;

    upstream meshcentral { server 172.31.250.20:4430; }

    server {
        listen 80 default_server;
        location = /health { return 200 "ok\n"; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl default_server;
        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1d;

        # Tayyor installer'larni LAN ichida tarqatish: https://<server>/dl/EnterpriseAgent_Setup.exe
        location /dl/ {
            alias /usr/share/nginx/dl/;
            autoindex off;
            location ~ \.(msh|json)$ { deny all; }
            default_type application/octet-stream;
        }

        location / {
            proxy_pass http://meshcentral;
            proxy_http_version 1.1;
            proxy_set_header Host               $host;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         $connection_upgrade;
            proxy_set_header X-Forwarded-Host   $host:$server_port;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }
    }
}

# To'liq end-to-end sinov (haqiqiy Docker, nginx, MongoDB, MeshAgent):
#   1. setup.sh — noldan o'rnatish (DNS nom bilan)          + selftest
#   2. reconfigure-network.sh — IP va Docker subnet o'zgartirish + selftest + ServerID saqlanganini tekshirish
#   3. export-airgap.sh -> stack o'chiriladi -> import-airgap.sh boshqa papkaga, boshqa manzil va
#      cheklangan allowlist bilan (yopiq tarmoqqa ko'chirish simulyatsiyasi) + selftest
# Natija: installer, loglar — artefakt sifatida.
name: e2e-linux

on:
  push:
    paths-ignore: ["**.md", "docs/**", "branding/generate-placeholders.py"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Sinov DNS nomlari
        run: |
          echo "127.0.0.1 mesh.e2e.test mesh2.e2e.test" | sudo tee -a /etc/hosts
          sudo apt-get install -y -qq gettext-base jq >/dev/null

      - name: "1. setup.sh (noldan o'rnatish)"
        run: sudo ./setup.sh --host mesh.e2e.test

      - name: "1. natijalar"
        if: always()
        run: |
          sudo docker compose ps || true
          sudo jq . agent/out/EnterpriseAgent_Setup.build-info.json || true
          sudo jq '.settings | {cert, tlsOffload, agentAllowedIP, mongoDb: (.mongoDb|type)}' data/meshcentral-data/config.json || true
          sudo jq -r .serverId agent/out/EnterpriseAgent_Setup.build-info.json > /tmp/serverid-1 || true

      - name: "2. reconfigure-network (IP + Docker subnet)"
        run: |
          IP=$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i=="src"){print $(i+1); exit}}')
          echo "yangi manzil: $IP"
          sudo scripts/reconfigure-network.sh --host "$IP" --mesh-net 10.250.250 --purge-devices
          sudo scripts/selftest.sh
          test "$(sudo jq -r .serverId agent/out/EnterpriseAgent_Setup.build-info.json)" = "$(cat /tmp/serverid-1)"
          echo "ServerID o'zgarmadi"
          sudo jq -r .meshServer agent/out/EnterpriseAgent_Setup.build-info.json | grep -q "wss://$IP:443/agent.ashx"
          sudo jq -r .settings.tlsOffload data/meshcentral-data/config.json | grep -qx "10.250.250.10"
          mkdir -p /tmp/out && sudo cp agent/out/EnterpriseAgent_Setup.exe /tmp/out/EnterpriseAgent_Setup-test.exe

      - name: "3a. export-airgap"
        run: |
          sudo scripts/export-airgap.sh --no-backups --out /tmp/transfer
          ls -la /tmp/transfer
          sudo docker compose down
          sudo docker ps -a

      - name: "3b. import-airgap (boshqa papka, boshqa manzil, cheklangan allowlist)"
        run: |
          cd /tmp/transfer
          sudo tar -xf mesh-transfer-*.tar
          cd mesh-transfer-*/
          cat MANIFEST.txt
          sudo ./import-airgap.sh --dir /opt/mesh-imported --host mesh2.e2e.test \
               --agent-ip 192.168.0.0/16 --user-ip 192.168.10.0/24 --purge-devices
          test "$(sudo jq -r .serverId /opt/mesh-imported/agent/out/EnterpriseAgent_Setup.build-info.json)" = "$(cat /tmp/serverid-1)"
          echo "Import: ServerID o'zgarmadi"
          sudo jq '.settings | {cert, agentAllowedIP, userAllowedIP}' /opt/mesh-imported/data/meshcentral-data/config.json

      - name: Loglar
        if: always()
        run: |
          mkdir -p /tmp/out
          for d in "$GITHUB_WORKSPACE" /opt/mesh-imported; do
            [ -f "$d/docker-compose.yml" ] || continue
            (cd "$d" && sudo docker compose logs --no-color > "/tmp/out/compose-$(basename "$d").log" 2>&1 || true)
          done
          sudo cp /opt/mesh-imported/agent/out/*.exe /opt/mesh-imported/agent/out/*.json /tmp/out/ 2>/dev/null || true
          sudo chmod -R a+r /tmp/out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-linux-${{ github.run_number }}
          path: /tmp/out/
          retention-days: 14
